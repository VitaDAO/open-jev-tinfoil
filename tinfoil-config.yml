# Standalone Open Jev service. Model weights are bundled in the measured image.
# Tested source: 5fdab2988766829928137a8af01e31ec87d714fc (Actions 36054260778).
cvm-version: 0.14.7
cpus: 4
memory: 8192
containers:
  - name: open-jev
    image: ghcr.io/vitadao/open-jev-tinfoil@sha256:347e9fec7a61a87f067caffcd22270821a4ee3c65d880bd3b379b2696e34cc46
    env:
      - OMP_NUM_THREADS: "4"
      - MKL_NUM_THREADS: "4"
      - ENABLE_EXPERIMENTAL_SELECTOR: "1"
    secrets:
      - OPEN_JEV_API_KEY
    tmpfs:
      /tmp: rw,noexec,nosuid,nodev,size=64m,mode=1777
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
shim:
  upstream-port: 8080
  paths:
    - /health
    - /decide
    - /route
    - /v1/select
# No networks declared: closed outbound connectivity under CVM >= 0.10.0.
