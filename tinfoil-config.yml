# Standalone Open Jev service. Model weights are bundled in the measured image.
# Tested source: 6082fa607208b7dc5a5e77dc6ae0016ef1d45f8f (Actions 36066832590).
cvm-version: 0.14.7
cpus: 4
memory: 8192
containers:
  - name: open-jev
    image: ghcr.io/vitadao/open-jev-tinfoil@sha256:8cd6968c870c4e3407e064dcb69e36f55da2d60ae92d2b4498aa3f05945c50e1
    env:
      - OMP_NUM_THREADS: "4"
      - MKL_NUM_THREADS: "4"
      - ENABLE_EXPERIMENTAL_SELECTOR: "1"
    secrets:
      - OPEN_JEV_API_KEY
    tmpfs:
      /tmp: rw,noexec,nosuid,nodev,size=64m,mode=1777
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
shim:
  upstream-port: 8080
  paths:
    - /health
    - /decide
    - /route
    - /v1/select
# No networks declared: closed outbound connectivity under CVM >= 0.10.0.
