# Standalone Open Jev service. Model weights are bundled in the measured image.
# Tested source: 1ba182b (GitHub Actions run 35903692961).
cvm-version: 0.14.7
cpus: 4
memory: 8192
containers:
  - name: open-jev
    image: ghcr.io/vitadao/open-jev-tinfoil@sha256:ba7da2df50a4242721a4f5b4ca64ce1605384c887e08bb27ad55e10097f883d6
    env:
      - OMP_NUM_THREADS: "4"
      - MKL_NUM_THREADS: "4"
    secrets:
      - OPEN_JEV_API_KEY
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
shim:
  upstream-port: 8080
  paths:
    - /health
    - /decide
    - /route
# No networks declared: closed outbound connectivity under CVM >= 0.10.0.
