# Standalone Open Jev service. Model weights are bundled in the measured image.
# Tested source: 8d2b5a1835843e93449df45067d5e6044c9c42f3 (Actions 35985765271).
cvm-version: 0.14.7
cpus: 4
memory: 8192
containers:
  - name: open-jev
    image: ghcr.io/vitadao/open-jev-tinfoil@sha256:78a5423b259a27ce934280d80558257726e29e64868933c4a6e4362740dbcb53
    env:
      - OMP_NUM_THREADS: "4"
      - MKL_NUM_THREADS: "4"
      - ENABLE_EXPERIMENTAL_SELECTOR: "1"
    secrets:
      - OPEN_JEV_API_KEY
    tmpfs:
      /tmp: rw,noexec,nosuid,nodev,size=64m,mode=1777
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
shim:
  upstream-port: 8080
  paths:
    - /health
    - /decide
    - /route
    - /v1/select
# No networks declared: closed outbound connectivity under CVM >= 0.10.0.
