name: Build and test JEV candidate image
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Fetch exact pinned candidate model build input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download jev-r8-v4-build-input-20260930 --repo "$GITHUB_REPOSITORY" --pattern jev-r8-v4-models.tar.gz --dir "$RUNNER_TEMP"
          printf '%s  %s\n' '7fef7fdf0f89fd08f2eb5f541b34486f533ee16cc640622168cf6c28f744dbd3' "$RUNNER_TEMP/jev-r8-v4-models.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/jev-r8-v4-models.tar.gz"
          rm "$RUNNER_TEMP/jev-r8-v4-models.tar.gz"
      - name: Build exact candidate Linux CPU image
        run: docker build -t "ghcr.io/vitadao/open-jev-tinfoil:candidate-${{ github.sha }}" .
      - name: Full implementation suite in the Linux image
        run: |
          docker run --rm --entrypoint sh --user 0 -e OPEN_JEV_PARSER=rules -v "$PWD/learned_models:/tinfoil/models/jev-learned:ro" -v "$PWD/tests:/app/tests:ro" -v "$PWD/scripts:/app/scripts:ro" -v "$PWD/evidence:/app/evidence:ro" -v "$PWD/experiments:/app/experiments:ro" "ghcr.io/vitadao/open-jev-tinfoil:candidate-${{ github.sha }}" -c 'pip install pytest==9.1.1 httpx==0.28.1 tinfoil==0.14.0 >/dev/null && PYTHONPATH=/app:/app/vendor python -m pytest -q tests' | tee "$RUNNER_TEMP/unit-tests.txt"
      - name: Actual learned serving with 8 GB and four CPUs
        shell: bash
        run: |
          set -euo pipefail
          export OPEN_JEV_CANDIDATE_API_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$OPEN_JEV_CANDIDATE_API_KEY"
          docker run -d --name jev-candidate-smoke --memory 8g --cpus 4 --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 -v "$PWD/learned_models:/tinfoil/models/jev-learned:ro" -e ENABLE_EXPERIMENTAL_SELECTOR=1 -e OPEN_JEV_CANDIDATE_API_KEY -p 127.0.0.1:18080:8080 "ghcr.io/vitadao/open-jev-tinfoil:candidate-${{ github.sha }}"
          ready=false
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:18080/health > "$RUNNER_TEMP/health.json"; then ready=true; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' jev-candidate-smoke)" != true ]; then docker logs jev-candidate-smoke; exit 1; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs jev-candidate-smoke; exit 1; fi
          python -m pip install pydantic==2.13.5 httpx==0.28.1
          PYTHONPATH=.:vendor python scripts/verify_candidate.py --base-url http://127.0.0.1:18080 --output "$RUNNER_TEMP/linux-parity.json"
          OPEN_JEV_API_KEY="$OPEN_JEV_CANDIDATE_API_KEY" python scripts/smoke.py > "$RUNNER_TEMP/legacy-contract.json"
          docker stats --no-stream --format '{{json .}}' jev-candidate-smoke > "$RUNNER_TEMP/resources.json"
          docker exec jev-candidate-smoke cat /sys/fs/cgroup/memory.peak > "$RUNNER_TEMP/memory-peak.txt"
          docker rm -f jev-candidate-smoke
      - name: Push only the validated candidate image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/vitadao/open-jev-tinfoil:candidate-${{ github.sha }}"
          docker push "$image" | tee "$RUNNER_TEMP/push.txt"
          docker image inspect "$image" > "$RUNNER_TEMP/image-inspect.json"
          docker manifest inspect "$image" > "$RUNNER_TEMP/registry-manifest.json"
      - name: Preserve synthetic candidate acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jev-candidate-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/unit-tests.txt
            ${{ runner.temp }}/health.json
            ${{ runner.temp }}/linux-parity.json
            ${{ runner.temp }}/legacy-contract.json
            ${{ runner.temp }}/resources.json
            ${{ runner.temp }}/memory-peak.txt
            ${{ runner.temp }}/push.txt
            ${{ runner.temp }}/image-inspect.json
            ${{ runner.temp }}/registry-manifest.json
