name: Exact published image probes
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [diagnostic, vita]
        default: diagnostic
      profile_only:
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Read-only registry login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Exact image synthetic HTTP and inference probes
        env:
          PROBE_SUITE: ${{ inputs.suite }}
          PROFILE_ONLY: ${{ inputs.profile_only && '1' || '0' }}
        run: python scripts/probe_published_image.py
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-image-probes-${{ github.sha }}
          path: image-probe-output/
